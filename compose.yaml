# Local Postgres for dev and tests; CI, previews and prod use Neon.
# Databases: `main` (npm run dev, .env) and `test` (integration and e2e, .env.test / .env.e2e).
services:
    db:
        # Major version of Neon (18.6).
        image: postgres:18
        restart: unless-stopped
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
            POSTGRES_DB: main
        volumes:
            # postgres 18 keeps data in /var/lib/postgresql/<major>/docker.
            - pg18data:/var/lib/postgresql
            - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
    pg18data:
