name: Staging migrate

# Previews share the `staging` Neon branch: after a green CI run on a PR, apply its migrations to it (#75).
# `workflow_run` workflows are taken from the default branch, so changes here take effect after merge.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]

jobs:
    migrate-staging:
        # No forks: the job runs PR code with the staging secret.
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        concurrency:
            group: neon-staging
            cancel-in-progress: false
        env:
            DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
            - name: Check for migration changes
              id: changes
              env:
                  BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
              run: |
                  if [ -z "$BASE_REF" ]; then
                    echo "::notice::No pull request found for this CI run, staging is left as is"
                    echo "migrations=false" >> "$GITHUB_OUTPUT"
                  elif [ -z "$(git diff --name-only "origin/$BASE_REF...HEAD" -- drizzle/)" ]; then
                    echo "No changes in drizzle/, staging is left as is"
                    echo "migrations=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "migrations=true" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/setup-node@v4
              if: steps.changes.outputs.migrations == 'true'
              with:
                  node-version: 24
                  cache: npm
            - if: steps.changes.outputs.migrations == 'true'
              run: npm ci
            - name: Ensure staging DB url is set
              if: steps.changes.outputs.migrations == 'true'
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::NEON_STAGING_DATABASE_URL secret is missing or empty"
                    exit 1
                  fi
            - if: steps.changes.outputs.migrations == 'true'
              run: npm run db:migrate
