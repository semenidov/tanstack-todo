name: CI

on:
    pull_request:
    push:
        branches: [master]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck

    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run test:unit

    integration:
        runs-on: ubuntu-latest
        env:
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Create ephemeral Neon branch
              id: neon
              uses: neondatabase/create-branch-action@v5
              with:
                  username: neondb_owner
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch_name: ci-${{ github.run_id }}
                  api_key: ${{ secrets.NEON_API_KEY }}
            - name: Integration tests
              env:
                  DATABASE_URL: ${{ steps.neon.outputs.db_url }}
                  TEST_DB: '1'
              run: npm run test:integration
            - name: Delete ephemeral Neon branch
              if: always()
              uses: neondatabase/delete-branch-action@v3
              with:
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch: ci-${{ github.run_id }}
                  api_key: ${{ secrets.NEON_API_KEY }}

    e2e:
        needs: [quality, unit, integration]
        runs-on: ubuntu-latest
        env:
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Create ephemeral Neon branch
              id: neon
              uses: neondatabase/create-branch-action@v5
              with:
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch_name: e2e-${{ github.run_id }}
                  api_key: ${{ secrets.NEON_API_KEY }}
                  username: neondb_owner
            - name: Run E2E
              env:
                  DATABASE_URL: ${{ steps.neon.outputs.db_url }}
                  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              run: npm run test:e2e
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
            - name: Delete ephemeral Neon branch
              if: always()
              uses: neondatabase/delete-branch-action@v3
              with:
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch: e2e-${{ github.run_id }}
                  api_key: ${{ secrets.NEON_API_KEY }}

    migrate:
        if: github.ref == 'refs/heads/master'
        needs: [quality, unit, integration]
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Ensure migration DB url is set
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::NEON_MAIN_DATABASE_URL secret is missing or empty"
                    exit 1
                  fi
            - run: npm run db:migrate
