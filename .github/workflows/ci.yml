name: CI

on:
    pull_request:
    push:
        branches: [master]

concurrency:
    group: ci-${{ github.ref }}
    # Never cancel a master run: it may be in the middle of the prod `migrate`.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck

    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run test:unit

    # One ephemeral Neon branch per run, shared by integration and e2e, reset to a clean schema (#75).
    db-tests:
        needs: [quality, unit]
        runs-on: ubuntu-latest
        env:
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Create ephemeral Neon branch
              id: neon
              uses: neondatabase/create-branch-action@v5
              with:
                  username: neondb_owner
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
                  api_key: ${{ secrets.NEON_API_KEY }}
            - name: Reset to a clean schema
              env:
                  DATABASE_URL: ${{ steps.neon.outputs.db_url }}
                  ALLOW_DB_RESET: '1'
              run: npm run db:reset
            - name: Integration tests
              env:
                  DATABASE_URL: ${{ steps.neon.outputs.db_url }}
                  TEST_DB: '1'
              run: npm run test:integration
            - run: npx playwright install --with-deps chromium
            - name: Run E2E
              env:
                  DATABASE_URL: ${{ steps.neon.outputs.db_url }}
                  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              run: npm run test:e2e
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
            - name: Delete ephemeral Neon branch
              if: always()
              uses: neondatabase/delete-branch-action@v3
              with:
                  project_id: ${{ secrets.NEON_PROJECT_ID }}
                  branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
                  api_key: ${{ secrets.NEON_API_KEY }}

    migrate:
        if: github.ref == 'refs/heads/master'
        needs: [quality, unit, db-tests]
        runs-on: ubuntu-latest
        concurrency:
            group: neon-staging
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Ensure migration DB urls are set
              env:
                  MAIN_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
                  STAGING_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
              run: |
                  if [ -z "$MAIN_URL" ]; then
                    echo "::error::NEON_MAIN_DATABASE_URL secret is missing or empty"
                    exit 1
                  fi
                  if [ -z "$STAGING_URL" ]; then
                    echo "::error::NEON_STAGING_DATABASE_URL secret is missing or empty"
                    exit 1
                  fi
            - name: Migrate main
              env:
                  DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
              run: npm run db:migrate
            - name: Migrate staging
              env:
                  DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
              run: npm run db:migrate
