name: Staging reset

# A PR with migrations closed without merging leaves its schema on the shared `staging` branch:
# reset `staging` to the schema of `master` (#75). Also available manually.
on:
    pull_request:
        types: [closed]
    workflow_dispatch:

jobs:
    check:
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == false
        runs-on: ubuntu-latest
        outputs:
            migrations: ${{ steps.changes.outputs.migrations }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
            - name: Check for migration changes
              id: changes
              run: |
                  if git diff --quiet origin/${{ github.base_ref }}...HEAD -- drizzle/; then
                    echo "No changes in drizzle/, staging is left as is"
                    echo "migrations=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "migrations=true" >> "$GITHUB_OUTPUT"
                  fi

    reset:
        needs: [check]
        if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.migrations == 'true')
        runs-on: ubuntu-latest
        concurrency:
            group: neon-staging
            cancel-in-progress: false
        env:
            DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Ensure staging DB url is set
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::NEON_STAGING_DATABASE_URL secret is missing or empty"
                    exit 1
                  fi
            - name: Reset staging to the schema of master
              env:
                  ALLOW_DB_RESET: '1'
              run: npm run db:reset
