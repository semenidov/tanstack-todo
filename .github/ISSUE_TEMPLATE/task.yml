name: Task
description: A feature, improvement, refactor or chore
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed. Link the discussion or a DECISIONS.md entry.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that makes "done" unambiguous.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What we deliberately don't do here.
