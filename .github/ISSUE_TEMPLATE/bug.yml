name: Bug
description: Something works incorrectly. Title in English, body in Russian.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include error messages, logs, or a Sentry link.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Production, preview (URL), or local. Browser if relevant.
    validations:
      required: true
